[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
ritual = "https://rpc.ritualfoundation.org"

[etherscan]
ritual = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.ritualfoundation.org/api" }

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
